<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>他們坐在哪裡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 一屏式：上方導覽列；左邊故事內容，右邊小燈。寬螢幕不捲動，窄螢幕改成上下排列。 */
:root{
  --bg:#FDF8F0; --card:#FFFFFF; --ink:#2B2A28; --soft:#6E6A63; --line:#E3DCD0;
  --me:#E08A2E; --them:#5A87B8; --ok:#4E8C5B; --hl:#F4E3C4; --ai:#2F7568; --aisoft:#E2F0EC;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1B19; --card:#262421; --ink:#F2EDE5; --soft:#A9A39A; --line:#3D3934;
  --me:#F0A452; --them:#84AEDC; --ok:#78B486; --hl:#3E3421; --ai:#7CC3B5; --aisoft:#22332F; color-scheme:dark;
}}
:root[data-theme="dark"]{--bg:#1C1B19;--card:#262421;--ink:#F2EDE5;--soft:#A9A39A;--line:#3D3934;--me:#F0A452;--them:#84AEDC;--ok:#78B486;--hl:#3E3421;--ai:#7CC3B5;--aisoft:#22332F;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:clamp(14px,calc(.5vw + 1.05vh),20px);line-height:1.65;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px;border-radius:6px}

.top{flex:none;display:flex;align-items:center;gap:14px;padding:8px 20px;border-bottom:3px solid var(--line)}
.top h1{font-size:1.1rem;font-weight:900;margin:0;white-space:nowrap}
.dots{flex:1;display:flex;justify-content:center;gap:9px;list-style:none;margin:0;padding:0}
.dots button{width:17px;height:17px;padding:0;border-radius:50%;border:3px solid var(--line);background:var(--card)}
.dots button[aria-current="true"]{background:var(--me);border-color:var(--me);transform:scale(1.25)}
.dots button.done{background:var(--line);border-color:var(--line)}
.navs{display:flex;gap:8px}
.navs button{min-height:44px;border-radius:999px;border:3px solid var(--ink);padding:2px 18px;font-weight:700;background:var(--card);white-space:nowrap}
.navs .go{background:var(--ink);color:var(--bg)}
.navs button:disabled{opacity:.3;cursor:default}

.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:16px;padding:14px 20px 16px}
.app.wide{grid-template-columns:minmax(0,1fr)}
.app.wide #side{display:none}
#stage,#side{min-height:0;overflow:auto}
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:clamp(12px,2vh,22px) clamp(14px,1.6vw,26px);height:100%}
h2{font-size:clamp(1.25rem,calc(1.1vw + 1.9vh),2.3rem);font-weight:900;line-height:1.25;margin:0;text-wrap:balance}
.lead{margin:0}
.when{display:inline-block;background:var(--hl);border-radius:999px;padding:2px 14px;font-weight:700;font-size:.88rem;margin-bottom:4px}
.scene{display:block;width:100%;height:100%;min-height:0;background:var(--bg);border:3px solid var(--line);border-radius:14px}
.cap{color:var(--soft);font-size:.85rem;margin:4px 0 0;text-align:center}

/* 年代頁 */
.era{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(8px,1.5vh,16px)}
.era .lead{margin-top:4px}
.mid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;min-height:0}
.pic{display:flex;flex-direction:column;min-height:0}
.pic .scene{flex:1 1 0}
.facts{display:grid;grid-template-rows:1fr 1fr;gap:10px;min-height:0}
.box{background:var(--bg);border:3px dashed var(--line);border-radius:14px;padding:8px 14px;display:flex;flex-direction:column;justify-content:center;text-align:center;min-height:0;overflow:auto}
.box.solid{border-style:solid}
.box .t{color:var(--soft);font-size:.82rem}
.box .w{font-size:clamp(1.2rem,calc(.8vw + 1.8vh),2rem);font-weight:900;letter-spacing:.06em;line-height:1.3}
.box .n{margin:0;font-size:.9rem}
.box .th{margin:2px 0 0;font-weight:700}
.evs h3{font-size:.95rem;margin:0 0 6px;color:var(--soft);font-weight:700}
.evbar{display:flex;flex-wrap:wrap;gap:8px}
.ev{display:flex;gap:8px;align-items:baseline;background:var(--bg);border:3px solid var(--line);border-radius:999px;padding:4px 14px;min-height:42px}
.ev .yr{font-weight:900;color:var(--me)}
.ev .ti{font-weight:700}
.ev:hover,.ev[aria-pressed="true"]{border-color:var(--me)}
.ev[aria-pressed="true"]{background:var(--hl)}
.det{margin:8px 0 0;background:var(--bg);border-radius:14px;padding:8px 14px;min-height:calc(1.65em * 2 + 16px)}
.det.empty{color:var(--soft)}
.det b{color:var(--me);margin-right:6px}

/* 右側：小燈 */
.side-card{display:flex;flex-direction:column;padding:0;overflow:hidden;border-color:var(--ai)}
.dh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:3px solid var(--line);flex:none}
.dh svg{width:36px;height:36px;flex:none}
.dh b{display:block;font-size:1.02rem;line-height:1.3}
.dh span{display:block;font-size:.8rem;color:var(--soft);line-height:1.3}
.qask{flex:none;margin:10px 12px 0;padding:8px 14px;border-radius:14px;background:var(--hl);font-weight:700;line-height:1.55}
.qask span{display:block;font-size:.78rem;color:var(--soft);font-weight:700;letter-spacing:.08em}
#disc{flex:1;min-height:0;display:flex;flex-direction:column}
#disc[hidden]{display:none}
.rec{flex:none;margin:8px 12px 0;font-size:.76rem;color:var(--soft);line-height:1.45}
.rec[hidden]{display:none}
.log{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:.95rem;line-height:1.6}
.msg{max-width:92%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot{background:var(--aisoft);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--hl);align-self:flex-end;border-bottom-right-radius:4px}
.msg.err{align-self:flex-start;background:transparent;color:var(--soft);font-size:.85rem;padding:0 4px}
.chips{flex:none;display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
.chip{border:2px solid var(--ai);background:var(--card);color:var(--ai);border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:700;min-height:36px}
.chip:disabled{opacity:.4;cursor:default}
.form{flex:none;display:flex;gap:8px;padding:8px 10px 10px;border-top:3px solid var(--line)}
.form textarea{flex:1;min-width:0;resize:none;font:inherit;font-size:.95rem;line-height:1.5;padding:8px 12px;border:3px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);height:48px}
.form textarea:focus{border-color:var(--ai);outline:none}
.form button{border:0;border-radius:14px;padding:0 16px;font-weight:900;min-height:48px;background:var(--ai);color:var(--bg)}
.form button.stop{background:var(--line);color:var(--ink)}
.form button[hidden]{display:none}
.offline{margin:12px;color:var(--soft)}
.offline[hidden]{display:none}

/* 封面 */
.cover{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:clamp(8px,1.6vh,16px);text-align:center}
.cover h2{font-size:clamp(1.6rem,calc(1.6vw + 2.6vh),3rem)}
.cover .lead{max-width:30em;margin:0 auto}
.big{min-height:clamp(48px,7vh,68px);width:100%;max-width:420px;margin:0 auto;display:block;border-radius:999px;border:0;background:var(--me);color:#241505;font-size:1.2rem;font-weight:900}
.goals{display:flex;flex-direction:column;gap:8px}
.goals h2{font-size:clamp(1.1rem,calc(.8vw + 1.6vh),1.7rem)}
.goals ol{margin:0;padding:0;list-style:none;display:grid;gap:clamp(5px,1vh,10px);counter-reset:g;flex:1;min-height:0;align-content:start}
.goals li{counter-increment:g;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--bg);border-radius:14px;padding:clamp(6px,1vh,12px) 12px;font-size:.9rem;line-height:1.5}
.goals li::before{content:counter(g);width:28px;height:28px;border-radius:50%;background:var(--me);color:#241505;font-weight:900;display:grid;place-items:center;font-size:.9rem}
.goals li.ai::before{background:var(--ai);color:var(--bg)}
.goals b{display:block}

/* 總整理 */
.recap{display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;min-height:0}
.rc{background:var(--bg);border:3px solid var(--line);border-radius:14px;padding:8px;text-align:center;display:flex;flex-direction:column;min-height:0}
.rc svg{flex:1 1 0;min-height:0;width:100%}
.rc svg text{display:none}
.rc .rw{font-weight:900;font-size:1.05rem}
.rc .ry{color:var(--soft);font-size:.82rem}
.key{display:flex;flex-direction:column;justify-content:center;gap:14px}
.key .big-q{font-size:clamp(1.1rem,calc(.8vw + 1.7vh),1.8rem);font-weight:900;line-height:1.5;margin:0}
.key p{margin:0}

/* 小考驗 */
.quiz{display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px 20px;min-height:0}
.qb{min-height:0;display:flex;flex-direction:column}
.qb .q{font-weight:700;margin:0 0 6px}
.opts{display:grid;gap:6px}
.opt{text-align:left;background:var(--bg);border:3px solid var(--line);border-radius:14px;padding:4px 14px;min-height:42px}
.opt:hover{border-color:var(--ink)}
.opt.yes{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--bg))}
.opt.no{border-color:var(--me);opacity:.75}
.fb{font-weight:700;margin:4px 0 0;min-height:1.65em;font-size:.92rem}
.fb.good{color:var(--ok)}

/* 窄螢幕（手機、直立平板）：改成上下排列，可以捲動 */
@media (max-width:860px), (max-aspect-ratio:4/5){
  html,body{height:auto}
  body{overflow:auto;font-size:17px}
  .top{flex-wrap:wrap;padding:8px 16px}
  .top h1{width:100%}
  .app,.app.wide{display:flex;flex-direction:column;padding:12px 16px 20px}
  #stage,#side{overflow:visible}
  .card{height:auto}
  .era,.cover,.recap,.quiz{display:flex;flex-direction:column;gap:12px}
  .mid,.qgrid,.rgrid{display:flex;flex-direction:column}
  .pic .scene,.scene{height:auto;flex:none}
  .rc svg{flex:none;height:auto}
  .facts{display:flex;flex-direction:column}
  .side-card{max-height:none}
  .log{max-height:55vh;min-height:140px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>他們坐在哪裡？</h1>
  <ul class="dots" id="dots"></ul>
  <div class="navs"><button id="back">← 上一頁</button><button class="go" id="go">下一頁 →</button></div>
</header>
<div class="app" id="app">
  <main id="stage" tabindex="-1"></main>
  <aside id="side" aria-label="小燈討論區"></aside>
</div>
<script>
const P='var(--them)', O='var(--me)';
function kid(x,y,c,s){s=s||1;return '<g transform="translate('+x+','+y+') scale('+s+')"><circle cx="0" cy="-16" r="9" fill="'+c+'"/><rect x="-9" y="-5" width="18" height="24" rx="9" fill="'+c+'"/></g>';}
function wheel(x,y,c){return '<g transform="translate('+x+','+y+')"><circle cx="0" cy="-16" r="9" fill="'+c+'"/><rect x="-9" y="-5" width="18" height="16" rx="7" fill="'+c+'"/><circle cx="0" cy="14" r="10" fill="none" stroke="'+c+'" stroke-width="3.5"/></g>';}
function house(x,y,w,h,label,dash){
  return '<g><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="4"'+(dash?' stroke-dasharray="10 8"':'')+'/>'+
   '<path d="M'+(x-10)+' '+y+' L'+(x+w/2)+' '+(y-30)+' L'+(x+w+10)+' '+y+' Z" fill="var(--line)"/>'+
   (label?'<text x="'+(x+w/2)+'" y="'+(y-42)+'" text-anchor="middle" font-size="17" font-weight="700" fill="var(--soft)">'+label+'</text>':'')+'</g>';
}
const SCENES=[
 function(){return house(360,120,210,120,'一般學校')+kid(400,205,P)+kid(440,205,P)+kid(480,205,P)+kid(520,205,P)+
   house(40,150,130,90,'特別的學校',1)+kid(80,215,O)+kid(125,215,O)+
   '<line x1="200" y1="110" x2="200" y2="270" stroke="var(--line)" stroke-width="5" stroke-dasharray="12 12"/>'+
   '<line x1="260" y1="110" x2="260" y2="270" stroke="var(--line)" stroke-width="5" stroke-dasharray="12 12"/>';},
 function(){return house(300,120,270,120,'一般學校')+kid(345,205,P)+kid(385,205,P)+kid(425,205,P)+kid(465,205,P)+kid(505,205,P)+
   house(120,150,140,90,'特別的班級')+kid(160,215,O)+kid(205,215,O)+
   '<path d="M90 195 L112 195" stroke="var(--me)" stroke-width="5" marker-end="url(#ar)"/>';},
 function(){return house(90,90,480,160,'')+
   '<text x="330" y="48" text-anchor="middle" font-size="17" font-weight="700" fill="var(--soft)">同一間學校</text>'+
   '<rect x="115" y="120" width="150" height="100" rx="10" fill="var(--bg)" stroke="var(--line)" stroke-width="4"/>'+
   '<text x="190" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="var(--soft)">資源班</text>'+
   kid(158,190,O)+kid(222,190,O)+kid(330,190,P)+kid(380,190,P)+kid(430,190,P)+kid(480,190,P)+kid(530,190,P);},
 function(){return house(90,90,480,160,'')+
   '<text x="330" y="48" text-anchor="middle" font-size="17" font-weight="700" fill="var(--soft)">同一間教室</text>'+
   '<path d="M120 215 L190 165 L190 215 Z" fill="var(--line)"/>'+
   kid(240,200,P)+wheel(295,198,O)+kid(350,200,P)+kid(405,200,O)+kid(460,200,P)+kid(515,200,P);}
];
function scene(i){return '<svg class="scene" viewBox="0 0 640 300" role="img" aria-label="'+ERAS[i].alt+'">'+
  '<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="var(--me)"/></marker></defs>'+
  '<line x1="40" y1="258" x2="600" y2="258" stroke="var(--line)" stroke-width="5"/>'+SCENES[i]()+'</svg>';}

const ERAS=[
 {when:'一百多年前　1891–1961', title:'那時候，他們在很遠的地方上學',
  lead:'以前，看不見或聽不見的小孩不能去一般的學校。他們要去很遠的、專門的學校，跟其他小孩分開。',
  alt:'左邊有一間分開的小學校，中間有兩道虛線隔開，右邊是一般學校',
  cap:'橘色是身心障礙的小孩，藍色是其他小孩。他們被線隔開了。',
  word:'盲生、啞生', wordNote:'那時候直接用「看不見」「不能說話」來叫他們。',
  think:'大人覺得：這些小孩好可憐，我們要照顧他們。',
  evs:[
   {y:'1891', t:'臺灣第一所盲人學校', d:'一位英國牧師在臺南開了一間學校，教看不見的小孩認點字、算數學、做手工，讓他們長大後能養活自己。這是臺灣特殊教育的開始。'},
   {y:'1917', t:'臺北也開了一間', d:'臺北設立了教視障和聽障小孩的學校，就是今天臺北啟明學校和啟聰學校的前身。那時候，這種專門的學校是唯一的選擇。'}],
  ask:'如果你的學校離家裡很遠很遠，遠到要住在學校，你會有什麼感覺？'},
 {when:'阿公阿嬤小時候　1962–1983', title:'他們搬到學校旁邊了',
  lead:'一般的學校開始開「特別的班級」，讓身心障礙的小孩也能來。雖然還是坐在不同的教室，但已經在同一個校園裡了。',
  alt:'特別的班級搬到一般學校旁邊，有箭頭表示靠近',
  cap:'橘色的小孩靠過來了，但還是在自己的教室。',
  word:'啟聰、啟明', wordNote:'「啟」是「打開」。大人希望打開他們的耳朵和眼睛。',
  think:'大人覺得：他們哪裡不好，我們要想辦法治好、補起來。',
  evs:[
   {y:'1962', t:'第一個特別的班級', d:'臺北市中山國小開了全臺灣第一個給智能障礙小孩的班級。隔年，屏東仁愛國小也開了給行動不方便的小孩的班級。'},
   {y:'1966', t:'可以在家附近上學了', d:'政府讓看不見的小孩能去住家附近的一般國小，再請老師到學校教他們點字。不用再離家那麼遠了。'},
   {y:'1978', t:'資源班出現', d:'學生大部分時間跟大家一起上課，只有需要的時候去「資源班」加強。這種方式一直用到今天。'},
   {y:'1980', t:'第一部身心障礙的法律', d:'叫做《殘障福利法》。雖然名字用了今天覺得不禮貌的詞，但這是國家第一次用法律照顧身心障礙的人。'}],
  ask:'跟大家在同一個學校，但在不同的教室上課。你覺得這樣算「在一起」嗎？'},
 {when:'爸爸媽媽小時候　1984–1996', title:'法律說：他們也有權利上學',
  lead:'國家訂了法律，寫明身心障礙的小孩一定要能上學，學校不可以拒絕。上學不再是別人的好心，而是每個人本來就有的權利。',
  alt:'資源班在學校裡面，兩群小孩在同一間學校',
  cap:'現在資源班在學校裡面了，大家在同一個屋簷下。',
  word:'殘障', wordNote:'法律用的詞是「殘障」。今天我們不這樣說了，因為這個詞聽起來不太尊重。',
  think:'大人開始覺得：上學是他們的權利，不是我們的好心。',
  evs:[
   {y:'1984', t:'第一部特殊教育法', d:'臺灣第一次用法律保障身心障礙學生上學的權利。從此學校不能隨便拒絕他們，政府也必須提供需要的幫助。'}],
  ask:'「權利」和「好心」有什麼不一樣？想想看：吃飯是你的權利，還是別人對你好？'},
 {when:'現在　1997 年到今天', title:'大家坐在同一間教室',
  lead:'現在，大部分身心障礙的學生和你在同一間教室上課。學校會做斜坡、放大字的課本、請老師幫忙，讓每個人都能一起學習。',
  alt:'所有小孩在同一間教室，有輪椅的同學和斜坡',
  cap:'橘色和藍色坐在一起了，學校也做了斜坡。',
  word:'身心障礙者', wordNote:'把「人」放在前面。他們先是一個人，才是一個有障礙的人。',
  think:'現在我們覺得：不方便的不是他，是環境。把環境改好，大家都可以一起。',
  evs:[
   {y:'1997', t:'改名字了', d:'法律把「殘障」改成「身心障礙者」。同一年特殊教育法也大修，明確規定要讓學生在「最少限制」的環境裡學習，也就是盡量跟大家在一起。'},

const QUIZ=[
 {q:'一百多年前，身心障礙的小孩在哪裡上學？', o:['很遠的、專門的學校','跟大家同一間教室','沒有學校可以上'], a:0,

const N=ERAS.length+3, stage=document.getElementById('stage'), side=document.getElementById('side'), app=document.getElementById('app'),

let page=0, answered={};

const GOALS=[

 ['說出尊重的話','明白叫法為什麼一直改，學會把「人」放在前面。'],

 ['和 AI 小幫手一起討論','每個年代的「想一想」，都可以和小燈聊。說出你的想法，小燈會先找出你想得好的地方，再問你一個小問題，陪你想得更深。']];
function draw(){
  var L='', R='', wide=false;
  if(page===0){
    L='<section class="card cover"><h2>他們坐在哪裡？</h2>'+

    R='<section class="card goals"><h2>這個程式的目標</h2><p class="lead" style="font-size:.9rem;color:var(--soft)">看完這個故事，希望你可以：</p><ol>'+

  } else if(page<=ERAS.length){
    var e=ERAS[page-1], i=page-1;
    L='<section class="card era"><div><span class="when">'+e.when+'</span><h2>'+e.title+'</h2><p class="lead">'+e.lead+'</p></div>'+

      '<div class="evs"><h3>那時候發生了什麼事？點年份看故事</h3><div class="evbar">'+
      e.evs.map(function(v,k){return '<button class="ev" data-ev="'+k+'" aria-pressed="false" aria-controls="det"><span class="yr">'+v.y+'</span><span class="ti">'+v.t+'</span></button>';}).join('')+
      '</div><p class="det empty" id="det" aria-live="polite">點上面的年份，看看那時候發生了什麼事。</p></div></section>';
    R='<section class="card side-card"><div class="dh">'+BOT+'<div><b>和 AI 小幫手小燈討論</b><span>這題沒有標準答案，說說你的想法吧</span></div></div>'+
      '<div class="qask"><span>想一想</span>'+e.ask+'</div>'+
      '<div id="disc" hidden><p class="rec" id="rec" hidden></p><div class="log" id="log" aria-live="polite"></div><div class="chips" id="chips"></div>'+
      '<form class="form" id="form"><label for="q" style="position:absolute;left:-9999px">我的想法</label>'+
      '<textarea id="q" placeholder="寫下你的想法…" maxlength="300"></textarea>'+
      '<button type="submit" id="send">送出</button><button type="button" class="stop" id="stop" hidden>停</button></form></div>'+
      '<p class="offline" id="offline">先自己想一想，再和旁邊的同學說說看。</p></section>';
  } else if(page===ERAS.length+1){
    L='<section class="card recap"><div><h2>一起看一次</h2><p class="lead">一百多年來，叫法變了，位置也變了。</p></div><div class="rgrid">'+
      ERAS.map(function(e,i){return '<div class="rc"><svg viewBox="0 0 640 300" aria-hidden="true">'+
        '<line x1="40" y1="258" x2="600" y2="258" stroke="var(--line)" stroke-width="5"/>'+SCENES[i]()+'</svg>'+
        '<div class="rw">'+e.word+'</div><div class="ry">'+e.when.split('　')[1]+'</div></div>';}).join('')+'</div></section>';
    R='<section class="card key"><div class="when" style="align-self:flex-start">最重要的一句話</div>'+
      '<p class="big-q">他們從「被分開」走到「在一起」。</p>'+
      '<p>改變的不是他們，是我們怎麼看他們、還有我們把環境做成什麼樣子。</p>'+
      '<p style="color:var(--soft);font-size:.9rem">想再看一次哪個年代，點上面的圓點就可以跳過去。</p></section>';
  } else {
    wide=true;
    L='<section class="card quiz"><div><h2>小考驗</h2><p class="lead">四題，答錯也沒關係，可以再選一次。</p></div><div class="qgrid">'+
      QUIZ.map(function(q,qi){return '<div class="qb"><p class="q">'+(qi+1)+'. '+q.q+'</p><div class="opts">'+
        q.o.map(function(o,oi){return '<button class="opt" data-q="'+qi+'" data-o="'+oi+'">'+o+'</button>';}).join('')+
        '</div><p class="fb" id="fb'+qi+'"></p></div>';}).join('')+'</div></section>';
  }
  stage.innerHTML=L; side.innerHTML=R; app.classList.toggle('wide',wide); dots();
  backEl.disabled = page===0; goEl.disabled = page===N-1;
  goEl.textContent = page===0 ? '開始 →' : (page===N-1 ? '最後一頁' : '下一頁 →');
  stage.scrollTop=0; window.scrollTo(0,0); stage.focus({preventScroll:true});
  Object.keys(answered).forEach(function(k){
    var m=answered[k]; if(!m) return;
    var box=stage.querySelector('#fb'+k); if(!box) return;
    box.textContent=m.msg; box.className='fb'+(m.ok?' good':'');
    stage.querySelectorAll('[data-q="'+k+'"]').forEach(function(b){ if(+b.dataset.o===m.pick) b.classList.add(m.ok?'yes':'no'); });
  });
}
function goTo(p){ if(typeof AI!=="undefined") AI.leave(); page=Math.max(0,Math.min(N-1,p)); draw(); if(typeof AI!=="undefined") AI.mount(); }
goEl.onclick=function(){goTo(page+1)}; backEl.onclick=function(){goTo(page-1)};
dotsEl.onclick=function(e){var b=e.target.closest('[data-p]'); if(b) goTo(+b.dataset.p);};
stage.addEventListener('click',function(e){
  if(e.target.closest('#start')) return goTo(1);
  var ev=e.target.closest('[data-ev]');
  if(ev){ var v=ERAS[page-1].evs[+ev.dataset.ev];
    stage.querySelectorAll('[data-ev]').forEach(function(b){b.setAttribute('aria-pressed', b===ev?'true':'false');});
    var det=document.getElementById('det'); det.className='det'; det.innerHTML='<b>'+v.y+'</b>'+v.d; return; }
  var op=e.target.closest('[data-o]');
  if(op){ var qi=+op.dataset.q, oi=+op.dataset.o, q=QUIZ[qi], ok=oi===q.a;
    answered[qi]={pick:oi,ok:ok,msg:ok?q.y:q.n};
    stage.querySelectorAll('[data-q="'+qi+'"]').forEach(function(b){b.classList.remove('yes','no');});
    op.classList.add(ok?'yes':'no');
    var fb=document.getElementById('fb'+qi); fb.textContent=answered[qi].msg; fb.className='fb'+(ok?' good':''); }
});
document.addEventListener('keydown',function(e){
  if(e.target.matches('input,textarea')) return;
  if(e.key==='ArrowRight') goTo(page+1);
  if(e.key==='ArrowLeft') goTo(page-1);
});
/* 放上 GitHub Pages 時，小燈透過這個後端（Cloudflare Worker）呼叫 Claude API。部署好 Worker 後把網址貼在這裡。 */
var AI_ENDPOINT='https://where-they-sit-ai.chiaying999wen.workers.dev/';
var AI=(function(){
  var api={on:false}, sample=null, busy=false, ctl=null, era=-1;
  // 隨機學生代號：每次打開頁面產生一個，不含任何個人資料
  var SID=(function(){ var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', t=''; var a=new Uint8Array(6); (window.crypto||window.msCrypto).getRandomValues(a); for(var k=0;k<6;k++) t+=c[a[k]%c.length]; return t; })();
  var chats=ERAS.map(function(){return [];});           // 每個年代各自一段討論 [{role,text}]
  var HELLO='嗨，我是小燈！這題沒有標準答案。你先寫下自己的想法，我們一起聊聊。';
  var STORY=ERAS.map(function(e,i){return '第'+(i+1)+'個年代｜'+e.when+'｜'+e.title+'\n'+e.lead+'\n當時的叫法：'+e.word+'（'+e.wordNote+'）\n當時的想法：'+e.think+'\n事件：'+
    e.evs.map(function(v){return v.y+' '+v.t+'：'+v.d;}).join('；');}).join('\n\n');
  var GLOSS='詞語小字典：\n身心障礙：身體或大腦的某些功能，例如看、聽、說話、走路、學習或控制情緒，和大部分人不太一樣，在生活或上學時需要一些幫忙或調整。例如看不見的人用點字讀書、坐輪椅的人需要斜坡。身心障礙不是生病，也不是做錯事。\n點字：用手指摸紙上凸起的小點來讀的文字。\n資源班：學生大部分時間和全班一起上課，需要時才到資源班，由特教老師幫忙加強。\n合理調整：依照每個人的需要改變做法，例如考試多給時間、把課本做成有聲書。\n權利：每個人本來就應該有的，不是別人給的好心。';
  function rules(i){ return '你是「小燈」，陪國小學生（大約 8 到 12 歲）討論的 AI 小幫手。學生正在讀互動故事《他們坐在哪裡？》，講臺灣一百多年來，身心障礙學生從被分開上學，到和大家坐在同一間教室的過程。\n\n'+
    '現在學生在「'+ERAS[i].when+'｜'+ERAS[i].title+'」這一頁，討論的「想一想」題目是：\n「'+ERAS[i].ask+'」\n\n'+
    '討論的方式：\n1. 只用繁體中文，句子短、字簡單，像溫柔的大哥哥大姊姊。每次 2 到 3 句，不用列點、不用 Markdown 符號。\n'+
    '2. 接下來每則「學生寫的話」才是學生自己說的。題目裡的句子和例子（例如題目中的吃飯）是題目的，不是學生想到的，不要說成是學生的。\n'+
    '3. 仔細讀學生寫的話，先判斷他是在回答、在提問、還是說不知道。如果他在回答，用他自己的關鍵詞具體稱讚他說得好的地方，不要說他「提出問題」。\n'+
    '4. 這題沒有標準答案，不要說學生錯。稱讚之後，只問一個能讓他再往前想一步的小追問；不要問他已經回答過的事，也不要自己先講一大段道理或替他說出答案。\n'+
    '5. 可以把學生的想法和這一頁的故事連起來，例如「你說的就像 1978 年的資源班…」。\n'+
    '6. 學生說不知道、或請你給提示時，給一個生活裡的小例子或從另一個角度問他，不要直接替他回答。\n'+
    '7. 聊了三、四輪之後，用一兩句話幫他整理他自己說過的想法，並稱讚他的思考。\n'+
    '8. 學生問詞語的意思時，先直接回答，再帶回題目。歷史事件、年份、法律只能根據故事內容說，故事裡沒有的就說「這個故事裡沒有寫到，可以問問老師喔」。\n'+
    '9. 用尊重的說法：說「身心障礙者」「坐輪椅的同學」。只有在解釋歷史時才提到舊說法。\n'+
    '10. 不要問學生的名字、學校、住址等個人資料。如果學生說到自己被欺負或很難過，先溫柔地接住他的感受，再請他告訴信任的大人，例如老師或家人。\n'+
    '11. 學生聊到和題目無關的事，簡短回應後，輕輕帶回題目。\n\n'+GLOSS+'\n\n故事內容：\n'+STORY; }
  var COPY={rate_limited:'小燈現在有點忙，等一下再送出一次好嗎？',session_expired:'要請大人幫忙重新登入，小燈才能回答。',
    refused:'這句話小燈沒辦法回答，換個方式說說看？',empty_completion:'小燈沒想出回答，換個說法試試看。'};
  function $(id){ return document.getElementById(id); }
  function bubble(m){ var d=document.createElement('div'); d.className='msg '+(m.role==='user'?'me':m.role==='err'?'err':'bot'); d.textContent=m.text; return d; }
  function render(){
    var log=$('log'); if(!log) return;
    log.innerHTML=''; log.appendChild(bubble({role:'bot',text:HELLO}));
    chats[era].forEach(function(m){ var d=bubble(m); m.el=d; log.appendChild(d); });
    log.scrollTop=log.scrollHeight;
    var chips=$('chips'); chips.innerHTML='';
    var c = chats[era].length ? ['給我一點提示','幫我整理我的想法'] : ['我不知道怎麼想','給我一點提示'];
    c.forEach(function(t){ var b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=t; b.disabled=busy;
      b.onclick=function(){ send(t); }; chips.appendChild(b); });
    $('send').hidden=busy; $('stop').hidden=!busy; $('q').disabled=busy;
  }
  function push(m){ chats[era].push(m); var log=$('log'); if(log){ var d=bubble(m); m.el=d; log.appendChild(d); log.scrollTop=log.scrollHeight; } return m; }
  async function send(text){
    text=(text||'').trim(); if(!text||busy||era<0) return;
    var i=era, list=chats[i];
    list.push({role:'user',text:text}); $('q').value='';
    var hist=list.filter(function(m){return m.role!=='err';}).slice(-12).map(function(m){return {role:m.role==='user'?'user':'assistant',content:m.text};});
    while(hist.length&&hist[0].role!=='user') hist.shift();
    var reply={role:'assistant',text:'小燈想一想…'}; list.push(reply);
    busy=true; render(); ctl=new AbortController();
    try{
      reply.text=await callAI(i,hist,ctl.signal,function(t){ reply.text=t; if(reply.el){ reply.el.textContent=t; var lg=$('log'); if(lg) lg.scrollTop=lg.scrollHeight; } });
    }catch(e){
      var code=e&&e.code, keep=e&&e.text?e.text.trim():'';
      if(keep) reply.text=keep; else list.splice(list.indexOf(reply),1);
      if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].indexOf(code)>=0){
        api.on=false; var d=$('disc'); if(d&&era===i) d.hidden=true; busy=false; return; }
      if(code!=='cancelled') list.push({role:'err',text:COPY[code]||'小燈剛剛斷線了，再送出一次試試看。'});
    }finally{ busy=false; if(era===i){ render(); var q=$('q'); if(q) q.focus(); } }
  }
  async function callAI(i,hist,signal,show){
    if(sample){
      var turns=hist.map(function(m){return m.role==='user' ? {role:'user',content:'學生寫的話：「'+m.content+'」'} : m;});
      var r=await sample([{role:'user',content:rules(i)},{role:'assistant',content:HELLO}].concat(turns),{signal:signal,modelTier:'quick',cache:false,
        onText:function(u){ show(u.text.trim()); }});
      return r.text.trim();
    }
    var res;
    try{ res=await fetch(AI_ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({era:i,messages:hist,sid:SID}),signal:signal}); }
    catch(e){ throw {code: e&&e.name==='AbortError' ? 'cancelled' : 'upstream_error'}; }
    if(!res.ok) throw {code: res.status===429 ? 'rate_limited' : 'upstream_error'};
    var data=await res.json(); if(!data||!data.text) throw {code:'empty_completion'};
    show(data.text.trim()); return data.text.trim();
  }
  api.mount=function(){
    era = page>=1&&page<=ERAS.length ? page-1 : -1;
    if(era<0||!api.on) return;
    $('disc').hidden=false; var off=$('offline'); if(off) off.hidden=true;
    var note=$('rec'); if(note){ note.hidden = !!sample; note.textContent='你的代號：'+SID+'。你和小燈的對話會被老師看到，用來改進教學，不會記錄你的名字。'; }
    render();
    $('form').addEventListener('submit',function(e){ e.preventDefault(); send($('q').value); });
    $('q').addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); send(e.target.value); } });
    $('stop').onclick=function(){ if(ctl) ctl.abort(); };
  };
  api.leave=function(){ if(busy&&ctl) ctl.abort(); };
  (async function(){
    try{ sample = window.claude&&window.claude.use ? await window.claude.use('sample') : null; }catch(e){ sample=null; }
    if(!sample && !AI_ENDPOINT) return;
    api.on=true; api.mount();
  })();
  return api;
})();
draw();
</script>
